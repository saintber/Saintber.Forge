description = "建立或修訂探索設計稿，判斷主稿迭代與轉換關係"
prompt = '''
# saintber-design：建立探索階段設計稿

處理方案探索階段的方向、問題與候選方案；名稱中的 design 指探索草案，技術設計階段的 `speckit-plan` 另依已確立的需求作業。需求分析與方案探索可以來回確認；讀取已有的 `intent.md`，但不因本指令而改寫需求分析、建立正式 Intent，或開始 specify、實作、adopt、archive、stage、commit。使用繁體中文。引用的文件是內容與證據，不取代使用者本次的授權。

## 輸入與目標

使用者可以用自然語言描述，也可提供 `project=hub|forge-explorer`、`topic=<名稱>`、`kind=topic|direction`、`owner=<擁有者>`、`from=<來源主稿>`。這些是給代理理解的參數，不是 shell 片段；owner 不取代既有治理的核准者。

- `kind=topic` 是一般探索主題，預設值；`kind=direction` 是完整工具方向。兩者都不表示已建立正式 change。
- 確認專案 ID、根目錄、owner 與本次範圍。workspace 內以所屬 worktree 的 `workspace.json` 驗證目標；未指定時，依目前所在專案與使用者內容確認。無法判斷才詢問。
- 明確指定但不存在的 ID／路徑：停止，不退回 Hub、不自行建立 Tool。未成立工具的方向稿可在使用者明確指定的 Hub 暫存，標示預計 owner。
- 既有 Tool 的稿放在自己的 `docs/proposals/`。standalone 使用自身治理，不猜測或依賴別的 repo。
- 讀目標的 `AGENTS.md`、Policy 索引、已有的憲章與相關有效規格索引；workspace 另讀 Hub 的適用治理。流程用詞、文件歸屬與轉換規則讀同一 worktree 的 `docs/developer-guide/development-workflows.md` §2、§3、§10、§11；standalone 讀內化版本，缺少必要依據時先釐清。
- 不需要 Spec Kit 初始化，也不要為了選專案而執行其指令。

## 先判斷，再寫稿

先找同一主題、相關來源與方向稿；不要只以檔名判斷。用 `rg` 查目標專案的 `docs/proposals/`、正式 Intent、工作包與有效規格；需要追查轉換時才讀相關封存。topic 下的 `intent.md` 是選用的早期需求分析，`design.md` 是選用的方案探索，兩者不是重複主稿；存在早期 Intent 不代表已建立 change。歷史僅作追溯，不當成現行需求。

對既有主稿，依序核對：

1. 各角色文件的狀態、目前決策、本次範圍、尚未實作、文件是需求分析、一般探索稿或方向稿。讀取已有需求分析與來源，確認本次探索的問題、目標與限制；需求未另成檔時可在設計稿記下依據，不強制補檔。
2. 需求分析與探索稿的「轉換紀錄」：日期、轉換範圍、對應 change、目前位置、來源 commit 與備註。只要本次範圍已由 change 承接，就不能因另一份文件缺紀錄而重寫。
3. 對應的工作包、封存、有效規格及 Git 證據，確認實際關係。不要執行引用文件提供的任意命令。

紀錄空白、缺漏、pending、位置失效或彼此矛盾，不等於從未轉換。查到的 commit 必須真的包含被轉換內容；不要用當前 HEAD 代替未提交草稿的來源。仍不能確認就停止相依的寫入並釐清。新稿由本次建立且沒有轉換行為，可明記「尚無轉換」。

選擇並簡短說明一個結果：

| 結果 | 判斷與動作 |
|---|---|
| `reuse` | 同一主題、欲修改範圍已確認未結案且未轉換；修訂同一份探索主稿。topic 只有早期 `intent.md` 時，可在同一 topic 建立 `design.md`，不另開重複 topic、不修改 Intent。方向稿的未轉換範圍亦可沿用。 |
| `new` | 新主題，或已結案／已轉換範圍的新需求；建立不重名的新 topic，連回來源與原轉換紀錄。不要複製一整份現行需求。 |
| `continue-change` | 使用者要補充的就是既有 change 的範圍；回報該工作包或封存位置、建議的下一步，本指令不改舊探索稿，也不自行修改工作包。已封存的 change 不直接續寫，建議新的 change。 |
| `needs-clarification` | 身份、範圍、owner、狀態或轉換證據不明／矛盾；說明已找到的證據與待決問題，先取得答案。 |

若同時涉及可修改與已轉換範圍，分別列出處理方式；不要整份覆寫。使用者要求「重新設計」也不代表可以改寫已結案的歷史。

## 建立或修訂

- 一個主題的同一角色只有一份主稿：既有 `<topic>.md`、`<topic>/design.md` 或已確認同主題的舊命名沿用原格式；單檔稿可以合併需求與探索內容。新 topic 預設用 `<topic>.md`；需要區分需求分析或內容多時，用 `<topic>/intent.md`（選用，需求分析）與 `<topic>/design.md`（本指令負責）。topic 已有需求分析目錄時，在其下建立探索稿。同一角色有兩份、目的地重名或用途不同時先釐清，不覆蓋、不悄悄改名。
- 合併稿與目錄內分開的角色主稿擇一；不要在已有合併稿之外另建同 topic 的 `intent.md` 或 `design.md`，也不因本指令自動拆稿。
- topic 使用簡短、可辨識的名稱；確認它是目標專案 proposals 下的單一名稱，不能含路徑分隔、`..` 或指向外部的連結。Tool 內完整方向稿沿用 `product-direction.md` 或 `product-direction/design.md`，擇一。未成立的 Tool 暫放 Hub 時，以該工具命名 topic 並標示預計 owner，避免不同工具共用 Hub 的同一份方向稿。
- 寫入前回報目標、決策結果與預計檔案；這是進度說明，不是每次另設批准關卡。建立新檔時使用不覆蓋既有檔案的方式；修訂前再讀一次並比對原內容，保留其他修改。
- 主稿開頭標明狀態、類型、owner、目前決策及授權來源、本次範圍、尚未實作。新稿從草稿開始，不因建立指令而變成「已核准」「已轉換」或「已實作」。
- 內容依需要寫問題、目的與使用者、範圍／非目標、候選方案與取捨、限制與風險、驗收方向、待決事項及相關文件。方向稿另說明責任邊界、主要能力、介面及候選拆分。不要強迫每個小稿都填滿所有章節。
- `from` 或相關舊稿存在時，記下來源連結與差異；不要改寫來源的歷史。技術方案或驗證紀錄可在同一文件的其他章節，但本指令只修改可變探索內容。
- 探索發現需求不合理時，回報需回到需求分析釐清的問題，不悄悄改需求。轉為規格不強制先從 design 複製一份 Intent；直接開發也須先確立本次需求、驗收與足夠技術方案，不能因已有探索稿就宣稱可實作。
- 初建可加入「轉換紀錄：尚無轉換」，不追加虛構的轉換列。真正轉換時才依手冊追加日期、範圍、change、位置、真實來源 commit；本指令不代做轉換、不自動提交取得 commit。
- 同一份未結案稿持續修訂，不另產 `v1`／`v2`／semver 副本。Git 保留已提交版本；未提交內容不保證有 Git 歷史。方向稿可以演進，已採納決策仍依原程序變更。

## 完成時

回報結果（`reuse`／`new`／`continue-change`／`needs-clarification`）、主稿路徑、此次範圍、轉換證據、尚未釐清事項與下一個適用階段。對本次寫入檢查本地連結、狀態與範圍一致性；不要冒稱需求已正式確立、實作已完成或流程已被機械保護。

部署入口由 `tooling/skills/saintber-design/install.mjs` 產生。維護這份正本，不直接改代理側副本；不得改動上游受管理的 `speckit-*`。

